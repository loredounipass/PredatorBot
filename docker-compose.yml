services:
  # ═══════════════════════════════════════════════
  # 🔴 Redis — In-Memory Message Broker & State Store
  # ═══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: predator-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass Pommeverte23
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a Pommeverte23 ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════
  # 🟢 MongoDB — Persistent Analytics & Ledger
  # ═══════════════════════════════════════════════
  mongodb:
    image: mongo:7
    container_name: predator-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: PredatorBot_Ledger
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ═══════════════════════════════════════════════
  # 🐺 PredatorBot — Application
  # ═══════════════════════════════════════════════
  predator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predator-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: PredatorBot_Ledger
    env_file:
      - .env
    command: ["node", "dist/main.js"]
    healthcheck:
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
